<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f2"><meta name="description" content="自记，随手记录。安卓、iOS 与网页的手动同步。">
  <title>自记</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234b7262'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='38' fill='%23fff' font-family='sans-serif'%3E记%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <div id="app">
    <header><div class="brand">自记</div><nav aria-label="记录工具"><button id="date-button">日期</button><button id="select-button">多选</button><button id="search-button" aria-label="搜索"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5" stroke-linecap="round"/></svg></button><button id="sync-button">同步</button><button id="settings-button" aria-label="设置">☰</button></nav></header>
    <div id="filter-bar" hidden></div><div id="range-bar" hidden></div>
    <main id="stream" tabindex="-1" aria-label="记录"><div class="empty">还没有记录</div></main>
    <footer id="composer"><textarea id="input" aria-label="记录内容" placeholder="记点什么…" rows="3"></textarea><div class="composer-bottom"><span id="save-status" role="status">已保存到本机</span><button id="send-button" class="primary">发送</button></div></footer>
    <div id="selection-bar" hidden></div>
  </div>
  <dialog id="panel"><div id="panel-content"></div></dialog>
  <div id="toast" role="status" hidden></div>
</body></html>
