<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f2"><meta name="description" content="自记，随手记录。安卓、iOS 与网页同步。">
  <title>自记</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234b7262'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='38' fill='%23fff' font-family='sans-serif'%3E记%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand-badge" aria-hidden="true">记</div>
      <div class="brand-copy"><div class="brand">自记</div><div id="subtitle" class="subtitle" hidden></div></div>
      <nav aria-label="记录工具">
        <button id="date-button" class="icon-button" aria-label="筛选" title="筛选"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></svg></button>
        <button id="select-button" class="icon-button" aria-label="多选" title="多选"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h11M10 12h11M10 18h11M3 6l1.5 1.5L7 4.5M3 12l1.5 1.5L7 10.5M3 18l1.5 1.5L7 16.5"/></svg></button>
        <button id="search-button" class="icon-button" aria-label="搜索" title="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
        <button id="sync-button" class="icon-button" aria-label="同步" title="同步"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.5 9a7 7 0 0 1 12-2l2.5 2M4 15l2.5 2a7 7 0 0 0 12-2"/></svg></button>
        <button id="settings-button" class="icon-button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="11" cy="17" r="2"/></svg></button>
      </nav>
      <div id="selection-header" hidden><button id="cancel-selection">取消</button><span id="selection-count">已选 0 条</span><button id="select-all">全选</button></div>
    </header>
    <div id="filter-bar" hidden></div><div id="range-bar" hidden></div>
    <main id="stream" tabindex="-1" aria-label="记录"><div class="empty">还没有记录</div></main>
    <button id="latest-button" hidden>↓ 最新</button>
    <footer id="composer"><div class="composer-card"><textarea id="input" aria-label="记录内容" placeholder="记点什么…" rows="2" maxlength="2000000"></textarea><div class="composer-bottom"><span id="save-status" role="status">已保存</span><button id="input-options-button" class="icon-button" aria-label="输入选项" title="输入选项">•••</button><button id="send-button" class="send-button" aria-label="发送记录" title="发送记录">↑</button></div><div id="save-actions" hidden><button id="retry-save-button">重试</button><button id="copy-draft-button">复制文字</button></div></div></footer>
    <div id="selection-bar" hidden></div>
  </div>
  <dialog id="panel"><div id="panel-content"></div></dialog>
  <div id="toast" role="status" hidden></div>
</body></html>
